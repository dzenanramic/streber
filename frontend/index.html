<!DOCTYPE html>
<html lang="bs" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f5">
  <title>Razgovor — Ema’s Library</title>

  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --ink: #17181a;
      --ink-soft: #44464c;
      --muted: #63666d;
      --accent: #33518f;
      --accent-ink: #2c477d;
      --accent-soft: #e9eefa;
      --code-bg: #f0f0ec;
      --user-bg: #17181a;
      --user-ink: #f7f7f5;
      --line: #dcdcd6;
      --line-2: #c3c4bd;
      --scrim: rgba(17, 18, 20, .46);
      --overlay-ink: #f5f5f2;
      --overlay-muted: #c9cacd;
      --ok: #1d5c3b;
      --ok-tint: #e6f1ea;
      --err: #a23328;
      --err-tint: #fbebe8;
      --shadow: 0 1px 2px rgba(17, 18, 20, .06), 0 8px 24px -12px rgba(17, 18, 20, .18);
      --ease: cubic-bezier(.2, .7, .2, 1);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #131416;
      --panel: #1d1e21;
      --ink: #f0f0ec;
      --ink-soft: #cfd0cc;
      --muted: #9fa1a6;
      --accent: #93ade8;
      --accent-ink: #b3c6f0;
      --accent-soft: #232b3b;
      --code-bg: #24262a;
      --user-bg: #f0f0ec;
      --user-ink: #17181a;
      --line: #34363b;
      --line-2: #4a4d53;
      --scrim: rgba(0, 0, 0, .64);
      --overlay-ink: #f0f0ec;
      --overlay-muted: #b9bbc0;
      --ok: #86c9a2;
      --ok-tint: #1b2d23;
      --err: #f1a396;
      --err-tint: #33211d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px -14px rgba(0, 0, 0, .65);
      color-scheme: dark;
    }

    [data-theme="sepia"] {
      --bg: #f2ebdd;
      --panel: #f8f2e6;
      --ink: #262119;
      --ink-soft: #4b4337;
      --muted: #6a6153;
      --accent: #7b4f2e;
      --accent-ink: #6b4326;
      --accent-soft: #e8dcc6;
      --code-bg: #e9e0cd;
      --user-bg: #33291d;
      --user-ink: #f6efe2;
      --line: #d8cdb6;
      --line-2: #bfb298;
      --scrim: rgba(32, 25, 16, .48);
      --overlay-ink: #f6efe2;
      --overlay-muted: #d2c8b6;
      --ok: #38603f;
      --ok-tint: #e2ecdc;
      --err: #96382b;
      --err-tint: #f3e0d9;
      --shadow: 0 1px 2px rgba(38, 33, 25, .08), 0 8px 24px -12px rgba(38, 33, 25, .22);
      color-scheme: light;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color .25s, color .25s;
      overflow: hidden
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--ink)
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 24px
    }

    /* ---------- Header ---------- */
    .masthead {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0 10px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .logo {
      width: 22px;
      height: 22px;
      color: var(--accent);
      flex-shrink: 0
    }

    .title {
      min-width: 0
    }

    .title h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.3
    }

    .title p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      transition: background-color .15s, color .15s
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-soft);
      color: var(--ink)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn svg,
    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0
    }

    .btn .chevron {
      width: 14px;
      height: 14px;
      color: var(--muted);
      transition: transform .18s
    }

    .btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg)
    }

    .icon-btn {
      width: 34px;
      padding: 0;
      color: var(--muted)
    }

    .btn.loading svg {
      animation: spin 1s linear infinite
    }

    .btn.loading {
      pointer-events: none;
      opacity: .7
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* Menu */
    .menu-wrap {
      position: relative
    }

    .menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 268px;
      padding: 6px;
      border-radius: 12px;
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line), 0 18px 40px -16px rgba(17, 18, 20, .35);
      z-index: 30;
      transform-origin: top right;
      animation: menuIn .16s var(--ease)
    }

    .menu[hidden] {
      display: none
    }

    @keyframes menuIn {
      from {
        opacity: 0;
        transform: translateY(-4px)
      }
    }

    .menu-label {
      padding: 8px 10px 4px;
      font-size: 13px;
      color: var(--muted)
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      text-align: left;
      line-height: 1.35
    }

    .menu-item svg {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      color: var(--muted);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0
    }

    .menu-item:hover:not(:disabled) {
      background: var(--accent-soft)
    }

    .menu-item:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .menu-item b {
      display: block;
      font-size: 14px;
      font-weight: 500
    }

    .menu-item small {
      display: block;
      margin-top: 1px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .menu-item.danger b,
    .menu-item.danger svg {
      color: var(--err)
    }

    .menu-item.danger:hover:not(:disabled) {
      background: var(--err-tint)
    }

    /* ---------- Transcript ---------- */
    .transcript {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 0 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      scrollbar-width: thin;
      scrollbar-color: var(--line-2) transparent
    }

    .transcript::-webkit-scrollbar {
      width: 10px
    }

    .transcript::-webkit-scrollbar-thumb {
      background: var(--line-2);
      border-radius: 6px;
      border: 3px solid var(--bg)
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: rise .3s var(--ease) both
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
      max-width: 80%
    }

    .msg.assistant {
      align-self: stretch
    }

    .who {
      font-size: 13px;
      color: var(--muted)
    }

    .msg.error .who {
      color: var(--err)
    }

    .bubble {
      font-size: 16px;
      line-height: 1.65;
      word-break: break-word
    }

    .msg.user .bubble {
      padding: 10px 16px;
      border-radius: 14px;
      background: var(--user-bg);
      color: var(--user-ink);
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.55
    }

    .msg.assistant .bubble {
      color: var(--ink)
    }

    .msg.error .bubble {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--err-tint);
      color: var(--ink);
      font-size: 14.5px;
      line-height: 1.55
    }

    .msg.error .bubble svg {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex-shrink: 0;
      color: var(--err);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .msg.error .bubble strong {
      font-weight: 600
    }

    .bubble p {
      margin: 0 0 .9em
    }

    .bubble p:last-child {
      margin: 0
    }

    .bubble ul,
    .bubble ol {
      margin: .5em 0 .9em;
      padding-left: 1.3em
    }

    .bubble li {
      margin: .2em 0
    }

    .bubble li::marker {
      color: var(--muted)
    }

    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .86em;
      padding: .1em .35em;
      border-radius: 4px;
      background: var(--code-bg)
    }

    .bubble strong {
      font-weight: 600
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--muted)
    }

    .msg.user .meta {
      flex-direction: row-reverse
    }

    .meta time {
      font-variant-numeric: tabular-nums
    }

    .mini {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0 -6px;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .15s, background-color .15s, color .15s
    }

    .mini svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .mini:hover {
      color: var(--ink);
      background: var(--accent-soft)
    }

    .msg:hover .mini,
    .msg:focus-within .mini,
    .mini:focus-visible,
    .mini.visible {
      opacity: 1
    }

    @media (hover:none) {
      .mini {
        opacity: 1
      }
    }

    /* Waiting */
    .waiting {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14.5px
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      flex-shrink: 0
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.1s infinite ease-in-out
    }

    .dots span:nth-child(2) {
      animation-delay: .15s
    }

    .dots span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .3;
        transform: none
      }

      50% {
        opacity: 1;
        transform: translateY(-2px)
      }
    }

    .waiting-text {
      transition: opacity .2s
    }

    /* ---------- Welcome ---------- */
    .welcome {
      margin: auto 0;
      padding: 24px 0 48px;
      animation: rise .4s var(--ease) both
    }

    .welcome h2 {
      margin: 0 0 12px;
      font-size: clamp(26px, 3.6vw, 32px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.2
    }

    .welcome .lead {
      margin: 0 0 34px;
      max-width: 50ch;
      font-size: 16px;
      color: var(--ink-soft)
    }

    .starters {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .starter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 13px 2px;
      text-align: left;
      font-size: 15px;
      color: var(--ink)
    }

    .starter .q {
      color: var(--ink-soft);
      transition: color .15s
    }

    .starter {
      color: var(--ink-soft)
    }

    .starter svg {
      width: 16px;
      height: 16px;
      color: var(--muted);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: transform .15s, color .15s
    }

    .starter:hover .q {
      color: var(--accent-ink)
    }

    .starter:hover svg {
      color: var(--accent-ink);
      transform: translateX(2px)
    }

    /* ---------- Composer ---------- */
    .composer {
      flex-shrink: 0;
      padding-bottom: max(22px, env(safe-area-inset-bottom))
    }

    .box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 8px 8px 16px;
      border-radius: 14px;
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
      transition: box-shadow .18s
    }

    .box:focus-within {
      box-shadow: 0 0 0 1px var(--line-2), var(--shadow)
    }

    textarea {
      flex: 1;
      min-height: 38px;
      max-height: 180px;
      padding: 8px 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      line-height: 1.5
    }

    textarea::placeholder {
      color: var(--muted)
    }

    .send {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--user-ink);
      background: var(--user-bg);
      transition: background-color .15s, opacity .15s
    }

    .send:hover:not(:disabled) {
      background: var(--accent)
    }

    .send:disabled {
      opacity: .3;
      cursor: not-allowed
    }

    .send svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .hint {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--muted)
    }

    kbd {
      font-family: inherit;
      font-size: 11.5px;
      padding: 0 4px;
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--line-2)
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 118px;
      transform: translate(-50%, 8px);
      opacity: 0;
      pointer-events: none;
      max-width: min(90vw, 480px);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line), var(--shadow);
      transition: opacity .25s, transform .25s;
      z-index: 60
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .toast.ok {
      color: var(--ok)
    }

    .toast.error {
      color: var(--err)
    }

    /* ---------- Flash cards ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--scrim);
      z-index: 50
    }

    .overlay.open {
      display: flex;
      animation: fade .2s
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    .modal {
      width: min(560px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: var(--overlay-ink);
      animation: modalIn .24s var(--ease)
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    .fc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--overlay-ink)
    }

    .fc-top .btn {
      color: var(--overlay-ink);
      background: none
    }

    .fc-top .btn:hover:not(:disabled) {
      background: none;
      text-decoration: underline;
      text-underline-offset: 4px
    }

    .fc-top kbd {
      box-shadow: 0 0 0 1px var(--overlay-muted);
      color: var(--overlay-muted)
    }

    .progress {
      height: 3px;
      border-radius: 3px;
      overflow: hidden;
      background: var(--overlay-muted)
    }

    .progress i {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: var(--overlay-ink);
      transition: width .3s var(--ease)
    }

    /* kartica koja se okreće */
    .card {
      perspective: 1400px;
      height: min(340px, 44vh);
      min-height: 240px;
      border-radius: 12px
    }

    .card-in {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .55s var(--ease);
      transform-style: preserve-3d
    }

    .card.flip .card-in {
      transform: rotateY(180deg)
    }

    .face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 40px 32px 32px;
      border-radius: 12px;
      text-align: center;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      font-size: clamp(18px, 2.4vw, 21px);
      line-height: 1.45
    }

    .face>div {
      max-width: 100%
    }

    .face p {
      margin: .3em 0
    }

    .face small {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 13px;
      color: var(--muted)
    }

    .face .fc-oblast {
      position: absolute;
      top: 16px;
      right: 20px;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--muted)
    }

    .face.back {
      transform: rotateY(180deg);
      background: var(--accent-soft)
    }

    .face .fc-empty {
      font-size: 15px;
      color: var(--muted)
    }

    .flip-hint {
      display: flex;
      justify-content: center;
      font-size: 13px;
      color: var(--overlay-muted)
    }

    .flip-hint kbd {
      box-shadow: 0 0 0 1px var(--overlay-muted);
      color: var(--overlay-ink);
      margin-right: 4px
    }

    .fc-nav {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .fc-nav .spacer {
      flex: 1
    }

    .fc-nav .btn {
      color: var(--overlay-ink)
    }

    .fc-nav .btn:hover:not(:disabled) {
      background: none;
      text-decoration: underline;
      text-underline-offset: 4px
    }

    .fc-nav kbd {
      box-shadow: 0 0 0 1px var(--overlay-muted);
      color: var(--overlay-muted)
    }

    .fc-nav .fc-next {
      margin-left: 4px
    }

    .fc-nav .reveal-wrap {
      margin-left: auto
    }

    /* MCQ panel */
    .mcq {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      overflow-y: auto;
      min-height: 0
    }

    .mcq[hidden] {
      display: none
    }

    .mcq-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      color: var(--muted)
    }

    .mcq-q {
      font-size: clamp(17px, 2.2vw, 19px);
      font-weight: 600;
      line-height: 1.4
    }

    .mcq-opts {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      line-height: 1.45;
      transition: background-color .15s
    }

    .opt:hover:not(:disabled) {
      background: var(--accent-soft)
    }

    .opt:disabled {
      cursor: default
    }

    .opt .key {
      flex-shrink: 0;
      width: 22px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted)
    }

    .opt.correct {
      background: var(--ok-tint)
    }

    .opt.correct .key,
    .opt.correct .opt-mark {
      color: var(--ok)
    }

    .opt.wrong {
      background: var(--err-tint)
    }

    .opt.wrong .key,
    .opt.wrong .opt-mark {
      color: var(--err)
    }

    .opt.picked {
      background: var(--accent-soft)
    }

    .opt.picked .key {
      color: var(--accent-ink)
    }

    .opt .opt-mark {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 500
    }

    .mcq-foot {
      font-size: 13.5px;
      color: var(--muted)
    }

    .mcq-result.ok {
      color: var(--ok);
      font-weight: 500
    }

    .mcq-result.bad {
      color: var(--err);
      font-weight: 500
    }

    /* primarno dugme */
    .btn.primary {
      padding: 0 16px;
      color: var(--user-ink);
      background: var(--user-bg)
    }

    .btn.primary:hover:not(:disabled) {
      color: var(--user-ink);
      background: #33404f;
      text-decoration: none
    }

    [data-theme="dark"] .btn.primary:hover:not(:disabled) {
      background: #dfe0dc
    }

    [data-theme="sepia"] .btn.primary:hover:not(:disabled) {
      background: #4a3b2a
    }

    .btn.primary:disabled {
      opacity: .4
    }

    /* ---------- Responsive ---------- */
    @media (max-width:640px) {
      .wrap {
        padding: 0 16px
      }

      .masthead {
        padding: 14px 0 6px
      }

      .title p,
      .hint {
        display: none
      }

      .actions {
        gap: 0
      }

      .btn {
        padding: 0 9px
      }

      .msg.user {
        max-width: 90%
      }

      .transcript {
        gap: 26px;
        padding-top: 12px
      }

      kbd {
        display: none
      }

      .overlay {
        padding: 12px
      }

      .modal.is-mcq .fc-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-flow: dense;
        gap: 8px
      }

      .modal.is-mcq .fc-nav .spacer {
        display: none
      }

      .modal.is-mcq .fc-nav .reveal-wrap {
        grid-column: 1 / -1;
        grid-row: 2;
        margin-left: 0
      }

      .modal.is-mcq #fcReveal {
        width: 100%
      }

      .modal.is-mcq .fc-nav #fcPrev {
        grid-column: 1;
        grid-row: 1
      }

      .modal.is-mcq .fc-nav .fc-next {
        grid-column: 2;
        grid-row: 1;
        margin-left: 0
      }

      .modal.is-mcq .fc-nav .mcq-foot {
        display: block;
        grid-column: 1 / -1;
        grid-row: 3;
        padding: 2px 0 0
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important
      }

      .msg,
      .welcome {
        opacity: 1 !important;
        transform: none !important
      }

      .card-in {
        transform-style: flat
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10 5 7 4.5 4 4.8v12.6c3-.3 6 .2 8 1.7 2-1.5 5-2 8-1.7V4.8c-3-.3-6 .2-8 1.7z" />
          <path d="M12 6.5v12.6" />
        </svg>
        <div class="title">
          <h1>Razgovor</h1>
          <p>Odgovori se temelje na podacima iz tvojih knjiga.</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="getFlashCardsBtn" type="button" title="Vježbaj kartice">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="7" width="13" height="11" rx="2" />
            <path d="M7 4h11a2 2 0 0 1 2 2v9" />
          </svg>
          <span>Vježbaj</span>
        </button>

        <button class="btn icon-btn" id="themeBtn" type="button" aria-label="Promijeni temu" title="Promijeni temu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>

        <div class="menu-wrap">
          <button class="btn" id="menuBtn" type="button" aria-haspopup="menu" aria-expanded="false"
            aria-controls="menu" title="Više opcija">
            <span>Više</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <div class="menu" id="menu" role="menu" aria-labelledby="menuBtn" hidden>
            <div class="menu-label">Biblioteka</div>
            <button class="menu-item" id="indexBtn" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" />
                <path d="M4 21V5" />
              </svg>
              <span><b>Indeksiraj knjige</b><small>Učitaj nove stranice u bazu</small></span>
            </button>
            <button class="menu-item" id="createFlashCardsBtn" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="7" width="13" height="11" rx="2" />
                <path d="M7 4h11a2 2 0 0 1 2 2v9" />
                <path d="M9.5 12.5h6M12.5 9.5v6" />
              </svg>
              <span><b>Kreiraj kartice</b><small>Napravi pitanja iz knjiga</small></span>
            </button>
            <button class="menu-item danger" id="clearBtn" type="button" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
              </svg>
              <span><b>Obriši razgovor</b><small>Ukloni sve poruke</small></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="transcript" id="transcript" aria-label="Razgovor">
      <div class="welcome" id="welcome">
        <h2>Pitaj nešto iz svojih knjiga</h2>
        <p class="lead">Odgovor se traži u indeksiranim stranicama, a ne na internetu.</p>
        <ul class="starters" id="prompts">
          <li>
            <button class="starter" type="button">
              <span class="q">Objasni patofiziologiju zatajenja srca</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </li>
          <li>
            <button class="starter" type="button">
              <span class="q">Napravi tabelu razlika između akutnog i hroničnog</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </li>
          <li>
            <button class="starter" type="button">
              <span class="q">Šta je potrebno znati za ispit iz patologije?</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </li>
          <li>
            <button class="starter" type="button">
              <span class="q">Ponovi glavne simptome dijabetesa</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </main>

    <footer class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Napiši pitanje" aria-label="Pitanje" enterkeyhint="send"
          autocomplete="off"></textarea>
        <button class="send" id="sendBtn" type="button" aria-label="Pošalji pitanje" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
        </button>
      </div>
      <div class="hint"><span><kbd>Enter</kbd> pošalji, <kbd>Shift</kbd> i <kbd>Enter</kbd> novi red</span></div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay">
    <div class="modal" id="fcModal" role="dialog" aria-modal="true" aria-label="Kartice">
      <div class="fc-top">
        <span id="fcCount" aria-live="polite"></span>
        <button class="btn" id="fcClose" type="button" aria-label="Zatvori kartice (Esc)">Zatvori <kbd>Esc</kbd></button>
      </div>
      <div class="progress" role="progressbar" id="fcProgress" aria-label="Napredak" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="0"><i id="fcBar"></i></div>
      <div class="card" id="card" tabindex="0" role="button" aria-pressed="false" aria-label="Okreni karticu (Space)">
        <div class="card-in">
          <div class="face">
            <small>Pitanje</small>
            <span class="fc-oblast" id="fcOblastFront"></span>
            <div id="fcFront"></div>
          </div>
          <div class="face back">
            <small>Odgovor</small>
            <span class="fc-oblast" id="fcOblastBack" aria-hidden="true"></span>
            <div id="fcBack"></div>
          </div>
        </div>
      </div>
      <div class="flip-hint" id="fcFlipHint"><kbd>Space</kbd> okreni kartu</div>
      <div class="mcq" id="fcMcq" hidden>
        <div class="mcq-head">
          <span id="fcTip"></span>
          <span class="hint" id="fcTipHint"></span>
        </div>
        <div class="mcq-q" id="fcMcqQ"></div>
        <ul class="mcq-opts" id="fcOpts" role="group" aria-label="Ponuđeni odgovori"></ul>
      </div>
      <div class="fc-nav">
        <button class="btn" id="fcPrev" type="button" aria-label="Prethodna kartica">Nazad</button>
        <button class="btn" id="fcFlip" type="button">Okreni <kbd>Space</kbd></button>
        <button class="btn fc-next" id="fcNext" type="button" aria-label="Sljedeća kartica">Naprijed</button>
        <span class="spacer" aria-hidden="true"></span>
        <span class="reveal-wrap"><button class="btn primary" id="fcReveal" type="button">Prikaži
            odgovor</button></span>
        <div class="mcq-foot">
          <span id="fcRevealInfo" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const API_BASE = "http://localhost:8000";
    const $ = (id) => document.getElementById(id);
    const transcript = $("transcript"), welcome = $("welcome"), input = $("input"),
      sendBtn = $("sendBtn"), indexBtn = $("indexBtn"), themeBtn = $("themeBtn"),
      menuBtn = $("menuBtn"), menu = $("menu"),
      createFlashBtn = $("createFlashCardsBtn"), getFlashBtn = $("getFlashCardsBtn"),
      toastEl = $("toast");

    const WAIT_TEXTS = [
      "Listam knjige… papiri su stari.",
      "Knjižničar je otišao po ljestve.",
      "Tražim odgovor između redova.",
      "Pitao sam arhivu, ali je na pauzi.",
      "Prelistavam bilješke iz margina.",
      "Odgovor je negdje u zadnjem poglavlju.",
      "Ovo poglavlje ima previše fusnota.",
      "Knjižničar traži naočale."
    ];

    let busy = false, waitCycle = null, toastTimer = null;
    let history = [];
    try { history = JSON.parse(localStorage.getItem("razgovor") || "[]"); } catch { history = []; }
    if (!Array.isArray(history)) history = [];

    /* ---------- Theme ---------- */
    const THEMES = ["light", "dark", "sepia"];
    const THEME_META = {
      light: {
        color: "#f7f7f5", label: "Svijetla tema",
        icon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
      },
      dark: {
        color: "#131416", label: "Tamna tema",
        icon: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
      },
      sepia: {
        color: "#f2ebdd", label: "Sepija tema",
        icon: '<path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v20H7.5A2.5 2.5 0 0 1 5 19.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19"/>'
      }
    };
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    function applyTheme(t, persist = true) {
      if (!THEMES.includes(t)) t = "light";
      document.documentElement.dataset.theme = t;
      const meta = THEME_META[t];
      themeBtn.setAttribute("aria-label", meta.label + " — promijeni temu");
      themeBtn.title = meta.label + " — promijeni temu";
      themeBtn.querySelector("svg").innerHTML = meta.icon;
      if (metaTheme) metaTheme.content = meta.color;
      if (persist) localStorage.setItem("theme", t);
    }
    applyTheme(localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), false);
    themeBtn.onclick = () => {
      const cur = document.documentElement.dataset.theme;
      if (cur === "light") applyTheme("dark");
      else if (cur === "dark") applyTheme("sepia");
      else applyTheme("light");
      toast(THEME_META[document.documentElement.dataset.theme].label, "ok");
    };

    /* ---------- Menu ---------- */
    function setMenu(open) {
      menu.hidden = !open;
      menuBtn.setAttribute("aria-expanded", String(open));
    }
    menuBtn.onclick = (e) => { e.stopPropagation(); setMenu(menu.hidden); };
    document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
    menu.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { setMenu(false); menuBtn.focus(); }
    });
    window.addEventListener("blur", () => setMenu(false));

    /* ---------- Helpers ---------- */
    function toast(msg, type = "") {
      toastEl.textContent = msg;
      toastEl.className = "toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const stampNow = () => new Date().toLocaleTimeString("bs-BA", { hour: "2-digit", minute: "2-digit" });

    /* Minimalni, siguran markdown (prvo escape, onda formatiranje) */
    function md(text) {
      const inline = (s) => esc(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      return String(text).split(/\n{2,}/).map((block) => {
        const lines = block.split("\n");
        if (lines.every((l) => /^\s*[-*•]\s+/.test(l)))
          return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>").join("") + "</ul>";
        if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l)))
          return "<ol>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
        return "<p>" + lines.map(inline).join("<br>") + "</p>";
      }).join("");
    }

    /* Naglasi samo prvu rečenicu (samo ako je kratka) — bez italic kuršiva. */
    function strongFirst(html) {
      return html.replace(/^<p>([^<]{1,90}?[.!?])(\s|$)/, "<p><strong>$1</strong>$2");
    }

    function setBusy(v) {
      busy = v;
      input.disabled = v;
      indexBtn.disabled = v;
      createFlashBtn.disabled = v;
      getFlashBtn.disabled = v;
      document.body.classList.toggle("is-busy", v);
      updateSend();
      if (!v) stopWait();
    }
    function updateSend() { sendBtn.disabled = busy || !input.value.trim(); }

    function startWait(el) {
      let i = Math.floor(Math.random() * WAIT_TEXTS.length);
      el.textContent = WAIT_TEXTS[i];
      waitCycle = setInterval(() => {
        el.style.opacity = "0";
        setTimeout(() => {
          i = (i + 1) % WAIT_TEXTS.length;
          el.textContent = WAIT_TEXTS[i];
          el.style.opacity = "1";
        }, 180);
      }, 2200);
    }
    function stopWait() { clearInterval(waitCycle); waitCycle = null; }

    function scrollDown() {
      requestAnimationFrame(() => transcript.scrollTo({ top: transcript.scrollHeight, behavior: "smooth" }));
    }

    const COPY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
    const DONE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const RETRY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.6 6.4"/><path d="M20 4v7h-7"/></svg>';
    const ERROR_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>';

    function miniButton(label, icon) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mini";
      b.innerHTML = icon + "<span>" + label + "</span>";
      return b;
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
        document.body.append(ta);
        ta.select();
        try { document.execCommand("copy"); } catch { }
        ta.remove();
      }
      btn.classList.add("copied");
      btn.innerHTML = DONE_ICON + "<span>Kopirano</span>";
      setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = COPY_ICON + "<span>Kopiraj</span>"; }, 1500);
    }

    function showWelcome(show) {
      if (welcome) welcome.style.display = show ? "" : "none";
    }

    /* Messages */
    function addMessage(role, text, { pending = false, save = true, stamp } = {}) {
      showWelcome(false);
      const m = document.createElement("div");
      m.className = "msg " + role;

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "Ti" : "Odgovor";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const meta = document.createElement("div");
      meta.className = "meta";
      const t = document.createElement("time");
      t.textContent = stamp || stampNow();
      meta.append(t);

      if (pending) {
        bubble.innerHTML = '<div class="waiting"><span class="dots" aria-hidden="true"><span></span><span></span><span></span></span><span class="waiting-text" role="status"></span></div>';
        startWait(bubble.querySelector(".waiting-text"));
      } else {
        fill(m, bubble, meta, role, text);
        if (save) persist(role, text, t.textContent);
      }
      m.append(who, bubble, meta);
      transcript.appendChild(m);
      scrollDown();
      return { m, bubble, meta, t };
    }

    function fill(m, bubble, meta, role, text) {
      if (role === "assistant") bubble.innerHTML = strongFirst(md(text)); else bubble.textContent = text;
      if (role === "assistant" && !meta.querySelector(".mini")) {
        const c = miniButton("Kopiraj", COPY_ICON);
        c.setAttribute("aria-label", "Kopiraj odgovor");
        c.onclick = () => copyText(text, c);
        meta.append(c);
      }
    }

    /* Greška ostaje u toku razgovora (vidljiva i nakon što toast nestane), sa opcijom Ponovi */
    function addError(message, question) {
      showWelcome(false);
      const m = document.createElement("div");
      m.className = "msg assistant error";

      const who = document.createElement("div");
      who.className = "who";
      who.textContent = "Greška";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = ERROR_ICON + "<div><strong>Odgovor nije stigao.</strong><br>" + esc(message) + "</div>";

      const meta = document.createElement("div");
      meta.className = "meta";
      const t = document.createElement("time");
      t.textContent = stampNow();
      meta.append(t);

      if (question) {
        const r = miniButton("Ponovi", RETRY_ICON);
        r.classList.add("visible");
        r.onclick = () => { m.remove(); send(question); };
        meta.append(r);
      }
      m.append(who, bubble, meta);
      transcript.appendChild(m);
      scrollDown();
    }

    function persist(role, text, stamp) {
      history.push({ role, text, stamp });
      history = history.slice(-60);
      try { localStorage.setItem("razgovor", JSON.stringify(history)); } catch { }
    }

    function restore() {
      if (!history.length) { showWelcome(true); return; }
      history.forEach((h) => {
        if (h && typeof h.text === "string") addMessage(h.role === "user" ? "user" : "assistant", h.text, { save: false, stamp: h.stamp });
      });
      transcript.scrollTop = transcript.scrollHeight;
    }

    $("clearBtn").onclick = () => {
      setMenu(false);
      if (busy) return;
      if (!history.length) { toast("Razgovor je već prazan"); return; }
      history = [];
      localStorage.removeItem("razgovor");
      transcript.querySelectorAll(".msg").forEach((n) => n.remove());
      showWelcome(true);
      toast("Razgovor očišćen");
      input.focus();
    };

    /* Send */
    async function send(prefill) {
      const text = (prefill || input.value).trim();
      if (!text || busy) return;

      setBusy(true);
      addMessage("user", text);
      input.value = "";
      input.style.height = "auto";
      updateSend();

      const pending = addMessage("assistant", "", { pending: true });
      try {
        const res = await fetch(API_BASE + "/question/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        if (!res.ok) throw new Error("Server je vratio grešku " + res.status + " (" + res.statusText + ").");
        const data = await res.json();
        const answer = typeof data === "string" ? data : data.answer || data.response || JSON.stringify(data, null, 2);

        stopWait();
        fill(pending.m, pending.bubble, pending.meta, "assistant", answer);
        persist("assistant", answer, pending.t.textContent);
        scrollDown();
      } catch (e) {
        stopWait();
        pending.m.remove();
        const msg = (e instanceof TypeError)
          ? "Nema veze sa serverom. Provjeri je li backend pokrenut na " + API_BASE + "."
          : (e.message || "Došlo je do greške pri slanju pitanja.");
        addError(msg, text);
        toast("Pitanje nije poslano", "error");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    /* Index */
    async function indexBooks() {
      if (busy) return;
      setMenu(false);
      setBusy(true);
      indexBtn.classList.add("loading");
      toast("Indeksiranje je u toku…");
      try {
        const res = await fetch(API_BASE + "/books/");
        if (!res.ok) throw new Error("Greška " + res.status + ": " + res.statusText);
        const data = await res.json();
        toast("Indeksiranje završeno: " + (data.Status || "OK"), "ok");
      } catch (e) {
        toast(e.message || "Greška pri indeksiranju knjiga.", "error");
      } finally {
        indexBtn.classList.remove("loading");
        setBusy(false);
      }
    }

    /* Flash cards */
    let cards = [], idx = 0, lastFocus = null;
    let picked = new Map();    // idx -> Set(odabranih opcija)
    let revealed = new Set();  // idx -> odgovor prikazan
    const card = $("card"), overlay = $("overlay"), modal = $("fcModal");
    const mcqEls = {
      q: $("fcMcqQ"), tip: $("fcTip"), hint: $("fcTipHint"), opts: $("fcOpts"),
      info: $("fcRevealInfo"), revealBtn: $("fcReveal"), revealWrap: $("fcReveal").parentElement,
      oblast: $("fcOblastFront")
    };
    /* Dugme "Prikaži odgovor" postoji samo na MCQ kartici */
    function setRevealVisible(visible) {
      mcqEls.revealWrap.style.display = visible ? "" : "none";
      modal.querySelector(".fc-nav").classList.toggle("no-reveal", !visible);
    }

    function cardState(c) {
      if (!picked.has(idx)) picked.set(idx, new Set());
      return { picked: picked.get(idx), revealed: revealed.has(idx) };
    }

    function pick(i, single) {
      const st = cardState(cards[idx]);
      if (st.revealed) return;
      if (single) {
        if (st.picked.has(i)) st.picked.clear();
        else { st.picked.clear(); st.picked.add(i); }
      } else if (st.picked.has(i)) st.picked.delete(i);
      else st.picked.add(i);
      renderOptions(cards[idx], mcqEls.q.dataset.single === "1");
    }

    function reveal(focusIndex = -1) {
      const c = cards[idx];
      if (!c || !c.opcije.length) return;
      if (!cardState(c).picked.size) { toast("Prvo odaberi barem jedan odgovor"); return; }
      revealed.add(idx);
      renderOptions(c, mcqEls.q.dataset.single === "1");
      // fokus ostaje na odabranoj opciji (ona je tada disabled) — olakšava čitanje i čitačima ekrana
      if (focusIndex >= 0) mcqEls.opts.querySelector('.opt[data-i="' + focusIndex + '"]')?.focus();
    }

    function resetCards() {
      picked = new Map();
      revealed = new Set();
    }

    /* Iz bilo kog oblika odgovora izvuci ravnu listu kartica.
       Podržava:
       - {"Card questions": [ "<json niz>", "<json niz>", ... ]}  (Po jedan fajl = jedan string)
       - {"Card questions": "<json niz>"} (ili niz objekata / jedan objekat)
       - ogoljeni JSON niz, JSON u markdown bloku, tekst prije/poslije JSON-a
       - stringovi koji su pojedinačni JSON objekat kartice */
    function collectCards(data) {
      const out = [];
      const visit = (node, depth) => {
        if (depth > 4 || node == null) return;
        if (Array.isArray(node)) { node.forEach((v) => visit(v, depth + 1)); return; }
        if (typeof node === "string") {
          const parsed = parseCardsPayload(node);
          if (parsed !== node) { visit(parsed, depth + 1); return; }
          if (node.trim()) out.push({ q: node, a: "", oblast: "", opcije: [], tip: "", brojTacnih: 0 });
          return;
        }
        if (typeof node === "object") {
          // objekat omotač: {"Card questions": ...} i sl.
          const vals = Object.values(node);
          const looksLikeCard = "pitanje" in node || "question" in node || "opcije" in node || "oblast" in node;
          if (looksLikeCard) { out.push(node); return; }
          const nested = vals.filter((v) => Array.isArray(v) || (v && typeof v === "object"));
          if (nested.length) { nested.forEach((v) => visit(v, depth + 1)); return; }
          if (vals.some((v) => typeof v === "string")) { vals.forEach((v) => visit(v, depth + 1)); return; }
          out.push(node);
        }
      };
      visit(data, 0);
      return out;
    }

    function normalizeCards(data) {
      return collectCards(data).map((c) => {
        if (typeof c === "string") return { q: c, a: "", oblast: "", opcije: [], tip: "", brojTacnih: 0 };
        if (!c || typeof c !== "object") return { q: "", a: "", oblast: "", opcije: [], tip: "", brojTacnih: 0 };
        const rawOpts = c.opcije || c.options;
        const opcije = Array.isArray(rawOpts) ? rawOpts.filter((o) => o != null && String(o).trim() !== "").map(String) : [];
        const rawA = c.odgovor ?? c.answers ?? c.answer ?? c.back ?? c.a ?? c.definition ?? "";
        const a = Array.isArray(rawA) ? rawA : rawA || "";
        const tip = c.tip || c.type || "";
        return {
          // backend: {"id","subject","type","question","options","correct_answers","answers"}
          oblast: c.oblast || c.subject || c.category || "",
          tip,
          opcije,
          brojTacnih: Number(c.broj_tacnih) || Number(c.correct_answers) || 0,
          q: c.pitanje || c.question || c.front || c.q || c.term || "",
          // odgovor može biti string (tačan odgovor) ili niz (indeksi/tekstovi)
          a
        };
      }).filter((c) => c.q || c.a || c.opcije.length);
    }

    /* Vrati parsiran JSON, a ako string nije JSON vrati isti string (signal za sirovi tekst). */
    function parseCardsPayload(data) {
      if (typeof data !== "string") return data;
      const s = data.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
      const attempt = (t) => { try { return JSON.parse(t); } catch { return undefined; } };
      let parsed = attempt(s);
      if (parsed === undefined) {
        const i = s.search(/[[{]/), j = Math.max(s.lastIndexOf("]"), s.lastIndexOf("}"));
        if (i !== -1 && j > i) parsed = attempt(s.slice(i, j + 1));
      }
      return parsed === undefined ? data : parsed;
    }

    const TIP_LABEL = { jedan_tacan: "Jedan tačan", vise_tacnih: "Više tačnih", otvoreno: "Otvoreno pitanje" };

    /* Koji indeksi opcija su tačni (odgovor: niz indeksa, niz tekstova, "a,c", "b"…) */
    function correctSet(c) {
      const n = c.opcije.length;
      if (!n || !Array.isArray(c.a) || !c.a.length) return null;
      const set = new Set();
      for (const v of c.a) {
        if (typeof v === "number" && v >= 0 && v < n) { set.add(v); continue; }
        const s = String(v).trim();
        const num = Number(s);
        if (s !== "" && Number.isInteger(num) && num >= 1 && num <= n) { set.add(num - 1); continue; }
        const letter = s.replace(/^[(\[]?\s*([A-Za-z])\s*[)\].:]*$/, "$1").toUpperCase();
        if (/^[A-Z]$/.test(letter) && letter.charCodeAt(0) - 65 < n) { set.add(letter.charCodeAt(0) - 65); continue; }
        const vi = c.opcije.findIndex((o) => String(o).trim().toLowerCase() === s.toLowerCase());
        if (vi !== -1) set.add(vi);
      }
      return set.size ? set : null;
    }

    function showCard() {
      const c = cards[idx];
      const mcq = c.opcije.length > 0;
      modal.classList.toggle("is-mcq", mcq);
      $("fcMcq").hidden = !mcq;
      card.style.display = mcq ? "none" : "";
      $("fcFlip").style.display = mcq ? "none" : "";
      $("fcFlipHint").style.display = mcq ? "none" : "";
      card.classList.remove("flip");
      card.setAttribute("aria-pressed", "false");
      card.setAttribute("aria-label", (mcq ? "Pitanje: " : "Kartica: ") + (c.q || "").slice(0, 120) + (mcq ? "" : " — pritisni Space za odgovor"));

      if (mcq) {
        mcqEls.q.textContent = c.q || "Pitanje nije dostupno";
        mcqEls.tip.textContent = TIP_LABEL[c.tip] || "Pitanje sa opcijama";
        const t = c.tip || (c.brojTacnih > 1 ? "vise_tacnih" : "jedan_tacan");
        const single = t === "jedan_tacan" || c.brojTacnih <= 1;
        mcqEls.hint.textContent = single ? "Odaberi jedan odgovor." :
          c.brojTacnih ? "Odaberi " + c.brojTacnih + " tačna odgovora." : "Odaberi sve što je tačno.";
        mcqEls.q.dataset.single = single ? "1" : "";
        mcqEls.oblast.textContent = c.oblast || "";
        mcqEls.oblast.style.display = c.oblast ? "" : "none";
        mcqEls.info.textContent = "";
        renderOptions(c, single);
        $("fcMcq").scrollTop = 0;
      } else {
        $("fcFront").textContent = c.q || "Pitanje nije dostupno";
        $("fcBack").innerHTML = renderAnswer(c);
        $("fcOblastFront").textContent = c.oblast || "";
        $("fcOblastFront").style.display = c.oblast ? "" : "none";
        $("fcOblastBack").textContent = c.oblast || "";
        $("fcOblastBack").style.display = c.oblast ? "" : "none";
        setRevealVisible(false);
      }
      $("fcCount").textContent = "Kartica " + (idx + 1) + " od " + cards.length;
      const pct = ((idx + 1) / cards.length * 100);
      $("fcBar").style.width = pct + "%";
      $("fcProgress").setAttribute("aria-valuenow", String(Math.round(pct)));
      $("fcPrev").disabled = idx === 0;
      $("fcNext").disabled = idx === cards.length - 1;
    }

    /* Odgovor kod kartica sa okretanjem (string ili niz) */
    function renderAnswer(c) {
      if (Array.isArray(c.a)) return c.a.length ? md(c.a.map(String).join("\n")) : '<span class="fc-empty">Odgovor nije pronađen u materijalu.</span>';
      return c.a ? md(c.a) : '<span class="fc-empty">Odgovor nije pronađen u materijalu.</span>';
    }

    function renderOptions(c, single) {
      const st = cardState(c);
      const show = st.revealed;
      const correct = correctSet(c);
      mcqEls.opts.innerHTML = "";
      c.opcije.forEach((text, i) => {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        b.dataset.i = i;
        const key = String.fromCharCode(65 + i);
        const label = key + ": " + String(text);
        b.innerHTML = '<span class="key" aria-hidden="true">' + key + "</span><span>" + esc(String(text)) + "</span>";
        if (!show) {
          if (st.picked.has(i)) b.classList.add("picked");
          b.setAttribute("aria-pressed", st.picked.has(i) ? "true" : "false");
          b.setAttribute("aria-label", label);
          b.onclick = () => pick(i, single);
        } else {
          b.disabled = true;
          if (correct?.has(i)) {
            b.classList.add("correct");
            b.setAttribute("aria-label", label + " — tačno");
            b.insertAdjacentHTML("beforeend", '<span class="opt-mark">tačno</span>');
          } else if (st.picked.has(i)) {
            b.classList.add("wrong");
            b.setAttribute("aria-label", label + " — netačno");
            b.insertAdjacentHTML("beforeend", '<span class="opt-mark">netačno</span>');
          } else {
            b.setAttribute("aria-label", label);
          }
        }
        li.append(b);
        mcqEls.opts.append(li);
      });

      const n = st.picked.size;
      setRevealVisible(!show);
      mcqEls.revealBtn.textContent = correct ? "Prikaži odgovor" : "Prikaži tačne odgovore";
      mcqEls.revealBtn.disabled = n === 0;
      mcqEls.info.className = "";
      if (!show) {
        mcqEls.info.textContent = single
          ? (n ? "Odabrano: 1" : "")
          : "Odabrano " + n + " / " + c.opcije.length;
        return;
      }
      if (correct) {
        let hit = 0, miss = 0;
        correct.forEach((i) => (st.picked.has(i) ? hit++ : miss++));
        const extra = n - hit;
        const ok = miss === 0 && extra === 0;
        mcqEls.info.className = "mcq-result " + (ok ? "ok" : "bad");
        mcqEls.info.textContent = ok ? "Tačno" : "Tačnih: " + hit + " / " + correct.size + (extra ? " · netačnih odabrano: " + extra : " · nedostaje: " + miss);
      } else {
        const broj = c.brojTacnih;
        mcqEls.info.textContent = n
          ? (broj ? "Tačan odgovor nije sačuvan (tačnih je " + broj + ")." : "Tačan odgovor nije sačuvan.")
          : "Tačan odgovor nije dostupan.";
      }
    }
    const step = (d) => {
      const next = Math.min(cards.length - 1, Math.max(0, idx + d));
      if (next === idx) return;
      idx = next;
      showCard();
    };
    const flip = () => {
      const on = card.classList.toggle("flip");
      card.setAttribute("aria-pressed", String(on));
    };
    function openCards() {
      lastFocus = document.activeElement;
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
      setTimeout(() => {
        const mcq = cards[idx] && cards[idx].opcije.length;
        const target = mcq ? (mcqEls.opts.querySelector(".opt") || $("fcNext")) : card;
        if (target) target.focus();
      }, 60);
    }
    function closeCards() {
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      document.body.style.overflow = "";
      if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); else input.focus();
    }

    /* Create: POST /flash-cards — backend generiše i snima kartice */
    async function createFlashCards() {
      if (busy) return;
      setMenu(false);
      setBusy(true);
      createFlashBtn.classList.add("loading");
      toast("Krećem s izradom pitanja…");
      try {
        const res = await fetch(API_BASE + "/flash-cards/", { method: "POST" });
        if (!res.ok) throw new Error("Greška " + res.status + ": " + res.statusText);
        const data = await res.json();
        const raw = typeof data === "string" ? data
          : Object.values(data || {}).find((v) => typeof v === "string") || "";
        toast(raw ? "Kartice: " + raw.slice(0, 140) : "Kartice su kreirane.", "ok");
      } catch (e) {
        toast(e.message || "Greška pri kreiranju kartica.", "error");
      } finally {
        createFlashBtn.classList.remove("loading");
        setBusy(false);
      }
    }

    /* Get: GET /flash-cards — dohvati sačuvane kartice i prikaži ih u modalu */
    async function getFlashCards() {
      if (busy) return;
      setBusy(true);
      getFlashBtn.classList.add("loading");
      try {
        const res = await fetch(API_BASE + "/flash-cards/?subject=patologija");
        if (!res.ok) throw new Error("Greška " + res.status + ": " + res.statusText);
        const data = await res.json();
        cards = normalizeCards(data);
        if (cards.length) {
          idx = 0; resetCards(); showCard(); openCards();
        } else {
          const raw = typeof data === "string" ? data
            : Object.values(data || {}).find((v) => typeof v === "string") || "";
          toast(raw ? "Kartice: " + raw.slice(0, 140) : "Nema sačuvanih kartica. Prvo kreiraj kartice.", "error");
        }
      } catch (e) {
        toast(e.message || "Greška pri dohvaćanju kartica.", "error");
      } finally {
        getFlashBtn.classList.remove("loading");
        setBusy(false);
      }
    }

    card.onclick = flip;
    card.onkeydown = (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); flip(); }
    };
    $("fcFlip").onclick = flip;
    mcqEls.revealBtn.onclick = () => reveal(picked.get(idx) ? [...picked.get(idx)][0] : -1);
    $("fcPrev").onclick = () => step(-1);
    $("fcNext").onclick = () => step(1);
    $("fcClose").onclick = closeCards;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCards(); });

    document.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("open")) return;
      if (e.key === "Escape") { closeCards(); return; }
      if (e.target.matches("textarea, input")) return;
      if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === " " && !e.target.closest("button")) {
        if (!cards[idx] || !cards[idx].opcije.length) { e.preventDefault(); flip(); }
      }
      else if (/^[a-h]$/i.test(e.key) && cards[idx]?.opcije.length && !revealed.has(idx)) {
        const i = e.key.toUpperCase().charCodeAt(0) - 65;
        if (i < cards[idx].opcije.length) { e.preventDefault(); pick(i, mcqEls.q.dataset.single === "1"); }
      }
      else if (e.key === "Enter" && cards[idx]?.opcije.length && !revealed.has(idx) && !e.target.closest("button")) {
        e.preventDefault(); reveal();
      }
    });

    /* Wiring */
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 170) + "px";
      updateSend();
    });
    sendBtn.onclick = () => send();
    indexBtn.onclick = indexBooks;
    createFlashBtn.onclick = createFlashCards;
    getFlashBtn.onclick = getFlashCards;
    $("prompts")?.querySelectorAll(".prompt").forEach((b) => (b.onclick = () => {
      const q = b.querySelector("span:last-child").textContent;
      input.value = q;
      input.dispatchEvent(new Event("input"));
      send();
    }));

    restore();
    input.focus();
  </script>
